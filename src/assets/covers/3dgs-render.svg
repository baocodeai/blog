<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#140f2b"/>
    </linearGradient>
    <radialGradient id="gauss-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gauss-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gauss-3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-3d)"/>
  
  <!-- 3D coordinate grid -->
  <g opacity="0.25" stroke="#475569" stroke-width="1">
    <line x1="400" y1="225" x2="700" y2="350"/>
    <line x1="400" y1="225" x2="100" y2="350"/>
    <line x1="400" y1="225" x2="400" y2="50"/>
  </g>

  <!-- Point cloud & Gaussians -->
  <ellipse cx="380" cy="210" rx="90" ry="45" transform="rotate(-25 380 210)" fill="url(#gauss-1)"/>
  <ellipse cx="450" cy="190" rx="75" ry="35" transform="rotate(35 450 190)" fill="url(#gauss-2)"/>
  <ellipse cx="330" cy="250" rx="80" ry="40" transform="rotate(15 330 250)" fill="url(#gauss-3)"/>
  <ellipse cx="460" cy="270" rx="60" ry="30" transform="rotate(-40 460 270)" fill="url(#gauss-1)"/>
  <ellipse cx="390" cy="150" rx="55" ry="25" transform="rotate(10 390 150)" fill="url(#gauss-2)"/>

  <!-- Camera Frustum Wireframe -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.8">
    <circle cx="160" cy="360" r="6" fill="#38bdf8"/>
    <polygon points="160,360 270,260 330,280 220,380"/>
    <polygon points="270,260 330,280 330,340 270,320" fill="rgba(56, 189, 248, 0.15)"/>
  </g>

  <!-- HUD info -->
  <rect x="25" y="25" width="230" height="42" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#334155" stroke-width="1"/>
  <text x="40" y="44" fill="#a855f7" font-family="monospace" font-size="11">GAUSSIANS COUNT</text>
  <text x="40" y="58" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="700">1.48M Splats (300 FPS)</text>

  <rect x="620" y="25" width="155" height="30" rx="6" fill="rgba(30, 41, 59, 0.9)" stroke="#475569" stroke-width="1"/>
  <text x="632" y="45" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="700">CUDA Tile Rasterizer</text>
</svg>
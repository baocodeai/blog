<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-diff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-diff)"/>

  <!-- Left: Canny Edge Map -->
  <rect x="90" y="130" width="180" height="200" rx="8" fill="#000000" stroke="#78716c" stroke-width="1.5"/>
  <path d="M 130 280 C 140 200 200 180 220 280" stroke="#ffffff" stroke-width="2" fill="none"/>
  <circle cx="175" cy="180" r="30" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text x="105" y="160" fill="#a8a29e" font-family="monospace" font-size="11">Canny Condition</text>

  <!-- Middle: Denoising latent step -->
  <g stroke="#f59e0b" stroke-width="2">
    <line x1="270" y1="230" x2="360" y2="230" stroke-dasharray="5,5"/>
    <polygon points="360,225 370,230 360,235" fill="#f59e0b"/>
  </g>

  <!-- Right: Generated High-Res Synthesis -->
  <rect x="380" y="120" width="330" height="220" rx="8" fill="#292524" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="480" cy="210" r="50" fill="#e11d48" opacity="0.8"/>
  <path d="M 420 310 C 450 240 540 230 600 310" fill="#4f46e5" opacity="0.7"/>
  <text x="400" y="150" fill="#fef08a" font-family="monospace" font-size="12" font-weight="700">Controlled Synthesis (LoRA)</text>
  <text x="400" y="172" fill="#d6d3d1" font-family="monospace" font-size="11">Classifier-Free Guidance: 7.5</text>

  <!-- HUD -->
  <rect x="25" y="25" width="220" height="42" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#334155" stroke-width="1"/>
  <text x="40" y="44" fill="#fbbf24" font-family="monospace" font-size="11">LATENT DIFFUSION</text>
  <text x="40" y="58" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="700">ControlNet + SDXL</text>
</svg>
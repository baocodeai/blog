  <text x="500" y="190" fill="#ffffff" font-family="monospace" font-size="11">"Locate the red cup."</text>
  <rect x="490" y="210" width="210" height="50" rx="4" fill="#312e81"/>
  <text x="500" y="230" fill="#a5b4fc" font-family="monospace" font-size="11">&lt;loc_340&gt;&lt;loc_520&gt;</text>
  <text x="500" y="248" fill="#34d399" font-family="monospace" font-size="11">Confidence: 0.96</text>

  <!-- HUD -->
  <rect x="25" y="25" width="220" height="42" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#334155" stroke-width="1"/>
  <text x="40" y="44" fill="#c084fc" font-family="monospace" font-size="11">MULTIMODAL VLM</text>
  <text x="40" y="58" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="700">Florence-2 0.77B</text>

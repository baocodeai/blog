  </defs>
  <rect width="800" height="450" fill="url(#bg-vlm)"/>

  <!-- Left: Image Patch Grid -->
  <g opacity="0.7">
    <rect x="90" y="130" width="240" height="190" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="130" y="160" width="100" height="120" rx="4" fill="rgba(129, 140, 248, 0.2)" stroke="#818cf8" stroke-width="2"/>
    <text x="135" y="152" fill="#c7d2fe" font-family="monospace" font-size="11">&lt;OD_BOX&gt;</text>
  </g>

  <!-- Attention Connection lines -->
  <g stroke="#a855f7" stroke-width="1.5" opacity="0.6" stroke-dasharray="4,4">
    <line x1="330" y1="200" x2="470" y2="170"/>
    <line x1="330" y1="250" x2="470" y2="240"/>
  </g>

  <!-- Right: Vision-Language Output Tokens -->
  <rect x="470" y="120" width="250" height="210" rx="8" fill="rgba(30, 27, 75, 0.9)" stroke="#a855f7" stroke-width="1.5"/>
  <text x="490" y="155" fill="#f472b6" font-family="monospace" font-size="12" font-weight="700">PROMPT &amp; GROUNDING</text>

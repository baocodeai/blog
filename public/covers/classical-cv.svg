<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-classical" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow-classical" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg-classical)"/>
  
  <!-- Subtle Grid Background -->
  <g opacity="0.12" stroke="#475569" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Kernel Matrix Visualization (Left) -->
  <g transform="translate(60, 120)" filter="url(#glow-classical)">
    <rect width="210" height="210" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="2"/>
    <text x="105" y="32" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">SOBEL 3x3 KERNEL</text>
    
    <!-- Matrix Cells -->
    <g font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">
      <rect x="20" y="50" width="48" height="42" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="44" y="76" fill="#f87171">-1</text>
      <rect x="81" y="50" width="48" height="42" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="105" y="76" fill="#94a3b8">0</text>
      <rect x="142" y="50" width="48" height="42" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="166" y="76" fill="#4ade80">+1</text>

      <rect x="20" y="100" width="48" height="42" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="44" y="126" fill="#f87171">-2</text>
      <rect x="81" y="100" width="48" height="42" rx="4" fill="#0f172a" stroke="#38bdf8"/>
      <text x="105" y="126" fill="#38bdf8">0</text>
      <rect x="142" y="100" width="48" height="42" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="166" y="126" fill="#4ade80">+2</text>

      <rect x="20" y="150" width="48" height="42" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="44" y="176" fill="#f87171">-1</text>
      <rect x="81" y="150" width="48" height="42" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="105" y="176" fill="#94a3b8">0</text>
      <rect x="142" y="150" width="48" height="42" rx="4" fill="#1e293b" stroke="#334155"/>
      <text x="166" y="176" fill="#4ade80">+1</text>
    </g>
  </g>

  <!-- Feature Matching / SIFT Keypoints (Center & Right) -->
  <g transform="translate(320, 100)" filter="url(#glow-classical)">
    <!-- Image Box 1 -->
    <rect x="0" y="20" width="190" height="210" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 30 180 Q 90 80 160 160" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <circle cx="50" cy="150" r="6" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
    <circle cx="100" cy="105" r="8" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
    <circle cx="145" cy="145" r="5" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>

    <!-- Image Box 2 -->
    <rect x="250" y="20" width="190" height="210" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 280 170 Q 330 90 410 150" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <circle cx="295" cy="142" r="6" fill="#ec4899" stroke="#fff" stroke-width="1.5"/>
    <circle cx="340" cy="100" r="8" fill="#ec4899" stroke="#fff" stroke-width="1.5"/>
    <circle cx="395" cy="138" r="5" fill="#ec4899" stroke="#fff" stroke-width="1.5"/>

    <!-- Correspondence Lines -->
    <line x1="50" y1="150" x2="295" y2="142" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="100" y1="105" x2="340" y2="100" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="145" y1="145" x2="395" y2="138" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,4"/>

    <text x="220" y="260" fill="#a78bfa" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">HOMOGRAPHY &amp; RANSAC</text>
  </g>

  <!-- Top Badges -->
  <rect x="25" y="25" width="220" height="34" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1"/>
  <text x="38" y="47" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">SIFT / ORB / CANNY</text>

  <rect x="615" y="25" width="160" height="34" rx="6" fill="rgba(30, 41, 59, 0.9)" stroke="#475569" stroke-width="1"/>
  <text x="630" y="47" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="700">OpenCV C++ / Python</text>
</svg>

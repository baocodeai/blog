<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-gpu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-gpu)"/>

  <!-- Pipeline architecture nodes -->
  <!-- Node 1: PyTorch Model -->
  <rect x="80" y="180" width="150" height="90" rx="8" fill="rgba(30, 41, 59, 0.9)" stroke="#64748b" stroke-width="1.5"/>
  <text x="100" y="215" fill="#f97316" font-family="monospace" font-size="12" font-weight="700">PyTorch</text>
  <text x="100" y="235" fill="#94a3b8" font-family="sans-serif" font-size="11">ViT / ConvNeXt</text>
  <text x="100" y="250" fill="#64748b" font-family="monospace" font-size="10">FP32 (180MB)</text>

  <!-- Arrow 1 -->
  <line x1="230" y1="225" x2="310" y2="225" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="310,220 320,225 310,230" fill="#38bdf8"/>

  <!-- Node 2: ONNX Quantized -->
  <rect x="320" y="170" width="160" height="110" rx="8" fill="rgba(30, 41, 59, 0.9)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="340" y="205" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">ONNX INT8</text>
  <text x="340" y="225" fill="#cbd5e1" font-family="sans-serif" font-size="11">Graph Fusion</text>
  <text x="340" y="245" fill="#22c55e" font-family="monospace" font-size="11">Quantized (45MB)</text>

  <!-- Arrow 2 -->
  <line x1="480" y1="225" x2="560" y2="225" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="560,220 570,225 560,230" fill="#10b981"/>

  <!-- Node 3: WebGPU WGSL Canvas -->
  <rect x="570" y="160" width="170" height="130" rx="8" fill="rgba(15, 23, 42, 0.95)" stroke="#10b981" stroke-width="2"/>
  <circle cx="595" cy="188" r="6" fill="#10b981"/>
  <text x="610" y="193" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">WebGPU WGSL</text>
  <text x="595" y="225" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Zero Server Cost</text>
  <text x="595" y="248" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">60.0 FPS</text>
  <text x="595" y="268" fill="#94a3b8" font-family="monospace" font-size="10">16.6 ms render</text>

  <!-- Top bar HUD -->
  <rect x="25" y="25" width="220" height="42" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#334155" stroke-width="1"/>
  <text x="40" y="44" fill="#38bdf8" font-family="monospace" font-size="11">DEPLOYMENT RUNTIME</text>
  <text x="40" y="58" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="700">Browser In-Memory</text>
</svg>
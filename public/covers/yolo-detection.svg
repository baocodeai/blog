<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-yolo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow-yolo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg-yolo)"/>
  <g opacity="0.15" stroke="#374151" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>
  <!-- Road perspective -->
  <polygon points="120,450 680,450 480,180 320,180" fill="#1e293b" opacity="0.3"/>
  <line x1="400" y1="180" x2="400" y2="450" stroke="#fbbf24" stroke-width="3" stroke-dasharray="16,16" opacity="0.6"/>

  <!-- Bounding Box 1 (Vehicle) -->
  <g filter="url(#glow-yolo)">
    <rect x="180" y="160" width="220" height="190" rx="4" fill="rgba(59, 130, 246, 0.12)" stroke="#3b82f6" stroke-width="2"/>
    <rect x="180" y="136" width="135" height="24" rx="4" fill="#3b82f6"/>
    <text x="188" y="152" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700">CAR #04  0.94</text>
    <!-- Crosshairs on corners -->
    <path d="M 175 170 L 180 170 L 180 165" stroke="#60a5fa" stroke-width="2" fill="none"/>
    <path d="M 405 170 L 400 170 L 400 165" stroke="#60a5fa" stroke-width="2" fill="none"/>
    <path d="M 175 345 L 180 345 L 180 350" stroke="#60a5fa" stroke-width="2" fill="none"/>
    <path d="M 405 345 L 400 345 L 400 350" stroke="#60a5fa" stroke-width="2" fill="none"/>
  </g>

  <!-- Bounding Box 2 (Pedestrian) -->
  <g filter="url(#glow-yolo)">
    <rect x="460" y="140" width="130" height="230" rx="4" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="2"/>
    <rect x="460" y="116" width="125" height="24" rx="4" fill="#10b981"/>
    <text x="468" y="132" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700">PERSON #12  0.89</text>
    <!-- Tracking Vector Arrow -->
    <line x1="525" y1="250" x2="570" y2="230" stroke="#34d399" stroke-width="2.5" stroke-dasharray="4,4"/>
    <circle cx="570" cy="230" r="4" fill="#34d399"/>
  </g>

  <!-- Inference HUD -->
  <rect x="25" y="25" width="220" height="42" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#334155" stroke-width="1"/>
  <circle cx="45" cy="46" r="5" fill="#22c55e"/>
  <text x="60" y="44" fill="#94a3b8" font-family="monospace" font-size="11">INFERENCE LATENCY</text>
  <text x="60" y="58" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="700">3.8 ms  (120 FPS)</text>

  <!-- Model Badge -->
  <rect x="640" y="25" width="135" height="30" rx="6" fill="rgba(30, 41, 59, 0.9)" stroke="#475569" stroke-width="1"/>
  <text x="652" y="45" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">TensorRT FP16</text>
</svg>